name: Update data

on:
  schedule:
    - cron: "17 5 1 * *"   # monthly, 1st at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download WFS data
        run: python scripts/acquire.py
      - name: Process
        run: python scripts/process.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/raw/*.provenance.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi
